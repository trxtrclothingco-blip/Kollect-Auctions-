<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auction Results – Kollect</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebase.js"></script>

<!-- ✅ DASHBOARD STYLE THEME -->
<script>
(function () {
  const isLight = localStorage.getItem("lightMode") === "true";

  if (isLight) {
    document.documentElement.classList.add("light-mode");
  }
})();
</script>

<style>
/* ✅ FORCE ALL TEXT BLACK */
* {
  color: #000000 !important;
}

/* ✅ FULL SCREEN RESPONSIVE BACKGROUND */
body {
  margin: 0;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('IMG_1917.jpeg') no-repeat center center;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
}

/* ✅ BURGER MENU ICON BLACK */
.burger div {
  background-color: #000000 !important;
}

/* ✅ NAV BAR WHITE BLURRY SEE THROUGH */
.nav-menu {
  background: rgba(255,255,255,0.75) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* ✅ PRODUCT CARDS BLACK BORDER + WHITE BACKGROUND */
.ended-auction {
  background: #ffffff;
  border: 2px solid #000000;
  border-radius: 8px;
  padding: 12px;
  width: 300px;
  height: 400px;
  margin: 15px;
  display: inline-block;
  vertical-align: top;
  text-align: center;
  overflow: hidden;
}

.ended-auction img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  border-radius: 6px;
  margin-bottom: 10px;
}

.ended-auction h3,
.ended-auction p {
  margin: 5px 0;
  color: #000000; /* all text black */
}

.ended-auction .button {
  margin-top: 10px;
  padding: 8px 12px;
  background: #ffffff;
  color: #000000;
  border: 1px solid #000000;
  border-radius: 6px;
  cursor: pointer;
}

/* ✅ KOLLECT100 BADGE BLACK BACKGROUND WITH WHITE TEXT */
.kollect100-badge {
  display: inline-block;
  background: #000000;
  color: #ffffff !important; /* corrected to white */
  font-weight: bold;
  padding: 2px 6px;
  margin-left: 6px;
  border-radius: 4px;
  font-size: 0.8rem;
}

#auction-pagination-controls {
  text-align: center;
  margin-top: 15px;
}

#auction-pagination-controls button {
  margin: 0 5px;
  padding: 8px 12px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="burger" id="burgerMenu">
  <div></div><div></div><div></div>
</div>

<nav class="nav-menu" id="navMenu">
  <a href="index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="about.html">About Us</a>
  <a href="live_auctions.html">Live Auctions</a>
  <a href="kollect_100.html">Watchlist ⭐️</a>
  <a href="private_sales.html">Private Sales</a>
  <a href="contact.html">Contact Us</a>
  <a href="results.html">Results</a>
  <a href="create_account.html">Sign In</a>
</nav>

<div id="user-status"></div>

<div class="container">
  <img src="IMG_1840.jpeg" alt="Kollect Auctions Logo" class="hero-image">
  <h1>Past Auction Results</h1>

  <div id="ended-auctions-list"></div>
  <div id="auction-pagination-controls"></div>

  <button class="button" onclick="window.location='index.html'">Back to Home</button>
</div>

<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

async function loadEndedAuctions() {
  const endedList = document.getElementById('ended-auctions-list');
  endedList.innerHTML = '';

  try {
    const endedQuery = query(collection(db, 'listings'), where('status', '==', 'ended'));
    const querySnapshot = await getDocs(endedQuery);

    if (querySnapshot.empty) {
      endedList.innerHTML = '<p>No ended auctions available.</p>';
      return;
    }

    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const { name, price, image, description, kollect100 } = data;

      const card = document.createElement('div');
      card.classList.add('ended-auction');

      card.innerHTML = `
        <img src="${image}" alt="${name}">
        <h3>
          ${name}
          ${kollect100 ? '<span class="kollect100-badge">Kollect 100</span>' : ''}
        </h3>
        <p>${description || ''}</p>
        <p><strong>Final Price:</strong> £${price?.toLocaleString() || '0.00'}</p>
      `;

      endedList.appendChild(card);
    });
  } catch (error) {
    console.error('Error loading auctions:', error);
    endedList.innerHTML = '<p>Error loading auctions. Please try again later.</p>';
  }
}

document.addEventListener('DOMContentLoaded', loadEndedAuctions);
</script>

<script>
/* Burger Menu */
document.getElementById("burgerMenu")
  .addEventListener("click", () =>
    document.getElementById("navMenu").classList.toggle("open")
  );

/* ✅ DASHBOARD MATCHING TOGGLE */
const toggleBtn = document.getElementById("modeToggle");

toggleBtn.addEventListener("click", () => {
  const root = document.documentElement;
  root.classList.toggle("light-mode");
  const isLight = root.classList.contains("light-mode");
  localStorage.setItem("lightMode", isLight);
});
</script>

<script src="/js/notification.js"></script>
  
</body>
</html>
