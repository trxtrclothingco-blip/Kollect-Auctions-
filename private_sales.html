<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Sales – Kollect Auctions</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>
<script type="module" src="products.js"></script>

<style>

/* ✅ FORCE ALL TEXT BLACK */
* {
  color: #000000 !important;
}

/* ✅ FULL SCREEN RESPONSIVE BACKGROUND */
body {
  margin: 0;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('IMG_1917.jpeg') no-repeat center center;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
}

/* ✅ NAV BAR WHITE SEE THROUGH BLURRY */
.nav-menu {
  background: rgba(255, 255, 255, 0.7) !important;
  backdrop-filter: blur(10px) !important;
  -webkit-backdrop-filter: blur(10px) !important;
}

/* ✅ BURGER ICON BLACK */
.burger div {
  background-color: #000000 !important;
}

/* ✅ PRODUCT CARDS BLACK BORDER */
.card {
  border: 2px solid #000000 !important;
  background: #ffffff !important;
  position: relative; /* helps with absolute positioning if needed later */
}

/* Clickable product name */
.card h3 {
  cursor: pointer;
  margin: 8px 0;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.card h3:hover {
  color: #0066cc !important;
}

/* NEW: Kollect100 badge */
.kollect100-badge {
  display: inline-block;
  background-color: #000000;
  color: #ffffff;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
  margin: 6px auto 2px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  text-align: center;
  width: fit-content;
}

/* NEW: Modal / Popup Styles */
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.7);
  overflow: auto;
}

.modal-content {
  background-color: #fefefe;
  margin: 8% auto;
  padding: 25px;
  border: 1px solid #888;
  width: 90%;
  max-width: 580px;
  border-radius: 10px;
  position: relative;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}

.close {
  color: #333;
  float: right;
  font-size: 36px;
  font-weight: bold;
  cursor: pointer;
  line-height: 0.8;
}

.close:hover,
.close:focus {
  color: #000;
  text-decoration: none;
}

.modal img {
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  margin-bottom: 18px;
}

.modal h2 {
  margin-top: 0;
  color: #000 !important;
}

/* ✅ UPDATED: Buy Now button now EXACTLY matches dashboardButton */
.buy-now-btn {
  padding: 6px 12px;
  background: linear-gradient(135deg, #2bb0ed, #4fd1ff) !important;
  color: #0f1117 !important;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
  transition: background 0.2s, transform 0.2s;
  box-shadow: 0 0 10px rgba(43, 176, 237, 0.4);
  text-decoration: none;
  display: inline-block;
  width: 100%;
  text-align: center;
  margin-top: 12px;
}

.buy-now-btn:hover {
  transform: translateY(-2px);
}

.no-link-msg {
  color: #666 !important;
  font-style: italic;
  margin-top: 12px;
}
</style>
</head>
<body data-page="privatesales">

<div class="burger" onclick="toggleMenu()">
  <div></div><div></div><div></div>
</div>

<nav class="nav-menu" id="navMenu">
  <a href="index.html">Home</a>
  <a href="dashboard.html">Dashboard</a>
  <a href="live_auctions.html">Live Auctions</a>
  <a href="private_sales.html">Private Sales</a>
  <a href="contact.html">Contact Us</a>
  <a href="results.html">Results</a>
  <a href="about.html">About Us</a>
  <a href="kollect_100.html">Support</a>
  <a href="create_account.html">Sign In</a>
</nav>

<div id="user-status">Checking login status...</div>
<button id="logout-button" style="display:none;" onclick="logoutUser()">Logout</button>

<div class="container">
  <img src="IMG_1840.jpeg" alt="Kollect Auctions Logo" class="hero-image">
  <h1>Private Sales</h1>
  <p>Fixed Price Collectables & One of a kind Items. </p>

  <!-- Container for dynamic items -->
  <div id="private-sales-list"></div>
</div>

<!-- Modal -->
<div id="itemModal" class="modal">
  <div class="modal-content">
    <span class="close">×</span>
    <div id="modalBody">
      <img id="modalImage" src="" alt="">
      <h2 id="modalName"></h2>
      <p id="modalDescription"></p>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './firebase.js';
  import { collection, getDocs } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

  const modal = document.getElementById('itemModal');
  const modalImage = document.getElementById('modalImage');
  const modalName = document.getElementById('modalName');
  const modalDescription = document.getElementById('modalDescription');
  const closeBtn = document.querySelector('.modal .close');

  function showModal(name, description, image) {
    modalImage.src = image || '';
    modalImage.style.display = image ? 'block' : 'none';
    modalName.textContent = name;
    modalDescription.textContent = description || 'No description available.';
    modal.style.display = 'block';
  }

  function closeModal() {
    modal.style.display = 'none';
  }

  closeBtn.addEventListener('click', closeModal);

  modal.addEventListener('click', (event) => {
    if (event.target === modal) {
      closeModal();
    }
  });

  async function loadPrivateSales() {
    const privateSalesList = document.getElementById('private-sales-list');
    privateSalesList.innerHTML = '';

    try {
      const querySnapshot = await getDocs(collection(db, 'privatesales'));

      if (querySnapshot.empty) {
        privateSalesList.innerHTML = '<p>No items available for private sale.</p>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const data = doc.data();
        const { name, description, price, image, stripeLink, kollect100 = false } = data;

        const card = document.createElement('div');
        card.classList.add('card');

        const buyNowSection = stripeLink
          ? `<a href="${stripeLink}" target="_blank" rel="noopener noreferrer" class="buy-now-btn">Buy Now</a>`
          : `<div class="no-link-msg">Contact for purchase</div>`;

        const badgeHTML = kollect100 
          ? `<div class="kollect100-badge">kollect100</div>`
          : '';

        card.innerHTML = `
          <img src="${image || ''}" alt="${name || 'Item'}">
          ${badgeHTML}
          <h3>${name || 'Unnamed Item'}</h3>
          <p>Price: £${Number(price || 0).toFixed(2)}</p>
          ${buyNowSection}
        `;

        const title = card.querySelector('h3');
        title.addEventListener('click', () => {
          showModal(
            name || 'Unnamed Item',
            description || 'No description available.',
            image || ''
          );
        });

        privateSalesList.appendChild(card);
      });
    } catch (error) {
      console.error('Error loading private sales:', error);
      privateSalesList.innerHTML = '<p>Error loading items. Please try again later.</p>';
    }
  }

  document.addEventListener('DOMContentLoaded', loadPrivateSales);
</script>

<script src="/js/notification.js"></script>
  
</body>
</html>
