<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account – Kollect Auctions</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebase.js"></script>
<style>
/* ✅ FORCE ALL TEXT BLACK */
* {
  color: #000000 !important;
}

/* ✅ FULL SCREEN RESPONSIVE BACKGROUND */
body {
  margin: 0;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('IMG_1917.jpeg') no-repeat center center;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
}

/* ✅ BURGER MENU ICON BLACK */
.burger div {
  background-color: #000000 !important;
}

/* ✅ NAV BAR WHITE BLURRY SEE THROUGH */
.nav-menu {
  background: rgba(255,255,255,0.75) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

/* ✅ ALL CARDS WHITE BACKGROUND */
.card {
  background: #ffffff !important;
}

/* ✅ INPUT FIELDS WHITE BACKGROUND */
input, textarea, select {
  background: #ffffff !important;
  color: #000000 !important;
}

/* Popup message styling */
.popup-message {
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: #4caf50;
  color: white;
  padding: 12px 20px;
  border-radius: 5px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 1000;
  font-family: inherit;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
}
.popup-message.show {
  opacity: 1;
}
</style>
</head>
<body>

<div class="burger" onclick="toggleMenu()">
  <div></div><div></div><div></div>
</div>

<nav class="nav-menu" id="navMenu">
  <a href="index.html">Home</a>
  <a href="about.html">About Us</a>
  <a href="live_auctions.html">Live Auctions</a>
  <a href="kollect_100.html">Watchlist ⭐️</a>
  <a href="private_sales.html">Private Sales</a>
  <a href="contact.html">Contact Us</a>
  <a href="results.html">Results</a>
  <a href="create_account.html">Sign In</a>
</nav>

<div id="user-status">Checking login status...</div>
<button id="logout-button" style="display:none;" onclick="logoutUser()">Logout</button>

<div class="container">
  <img src="IMG_1840.jpeg" alt="Kollect Auctions Logo" class="hero-image">

  <div class="card">
    <h2>Sign In</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="button" id="login-button" class="button">Sign In</button>
    </form>
  </div>

  <div class="card">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-firstname" placeholder="First Name" required>
      <input type="text" id="signup-lastname" placeholder="Last Name" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
      <input type="tel" id="signup-contact" placeholder="Contact Number" required>
      <input type="text" id="signup-address1" placeholder="Address Line 1" required>
      <input type="text" id="signup-address2" placeholder="Address Line 2">
      <input type="text" id="signup-city" placeholder="City" required>
      <input type="text" id="signup-postcode" placeholder="Postcode" required>
      <button type="submit" class="button">Create Account</button>
    </form>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut, sendEmailVerification } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const ADMIN_UID = "gBrbEobcS5RCG47acE5ySqxO8yB2";
const ADMIN_EMAIL = "peterjames-barrett@outlook.com";

const loginForm = document.getElementById("login-form");
const loginButton = document.getElementById("login-button");
const signupForm = document.getElementById("signup-form");
const userStatus = document.getElementById("user-status");
const logoutButton = document.getElementById("logout-button");

window.toggleMenu = () => document.getElementById("navMenu")?.classList.toggle("open");

const body = document.body;
if(localStorage.getItem("lightMode")==="true") body.classList.add("light-mode");
window.toggleMode = () => {
  const isLight = body.classList.toggle("light-mode");
  localStorage.setItem("lightMode", isLight);
};

window.logoutUser = async () => {
  try { 
    await signOut(auth);
    window.location.reload();
  } catch(e) { console.error(e); }
};

onAuthStateChanged(auth, user => {
  if(user){
    userStatus.textContent = `Logged in as ${user.email}`;
    logoutButton.style.display = "inline-block";
  } else {
    userStatus.textContent = "Not logged in";
    logoutButton.style.display = "none";
  }
});

function showPopupMessage(message){
  const popup = document.createElement("div");
  popup.className = "popup-message";
  popup.textContent = message;
  document.body.appendChild(popup);
  setTimeout(()=>popup.classList.add("show"), 10);
  setTimeout(()=>popup.remove(), 3000);
}

// ✅ LOGIN (Admin Bypass Added)
loginButton?.addEventListener("click", async () => {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    const isAdmin = user.uid === ADMIN_UID || user.email === ADMIN_EMAIL;

    if(!user.emailVerified && !isAdmin){
      alert("Please verify your email before logging in. Check your inbox.");
      await signOut(auth);
      return;
    }

    showPopupMessage("Login successful!");
    loginForm.reset();
    window.location.href = "index.html";
  } catch (err) {
    alert("Login failed: " + err.message);
  }
});

// Signup remains unchanged (still sends verification)
signupForm?.addEventListener("submit", async e => {
  e.preventDefault();
  const firstName = document.getElementById("signup-firstname").value.trim();
  const lastName = document.getElementById("signup-lastname").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value;
  const confirmPassword = document.getElementById("signup-confirm-password").value;
  const contact = document.getElementById("signup-contact").value.trim();
  const address1 = document.getElementById("signup-address1").value.trim();
  const address2 = document.getElementById("signup-address2").value.trim();
  const city = document.getElementById("signup-city").value.trim();
  const postcode = document.getElementById("signup-postcode").value.trim();

  if(password !== confirmPassword){
    return alert("Passwords do not match!");
  }

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    await updateProfile(user, { displayName: firstName + " " + lastName });

    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      firstName,
      lastName,
      email,
      contact,
      address1,
      address2,
      city,
      postcode,
      profilepicurl: "",
      createdAt: serverTimestamp()
    });

    await sendEmailVerification(user, {
      url: window.location.origin + '/create_account.html'
    });

    showPopupMessage("Account created! Check your email to verify before signing in.");
    signupForm.reset();
  } catch (err) {
    alert("Signup failed: " + err.message);
  }
});
</script>
</body>
</html>
