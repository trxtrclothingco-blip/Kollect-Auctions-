<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account – Kollect Auctions</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="firebase.js"></script>
<style>
* { color: #000000 !important; }

body {
  margin: 0;
  min-height: 100vh;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('IMG_1917.jpeg') no-repeat center center;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  z-index: -1;
}

.burger div { background-color: #000000 !important; }

.nav-menu {
  background: rgba(255,255,255,0.75) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.card { background: #ffffff !important; }

input, textarea, select {
  background: #ffffff !important;
  color: #000000 !important;
}

/* Popup message */
.popup-message {
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: #4caf50;
  color: white;
  padding: 12px 20px;
  border-radius: 5px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  z-index: 2000;
  font-size: 14px;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
}
.popup-message.show { opacity: 1; }

/* ✅ RESET MODAL */
.reset-modal-overlay {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.5);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:1500;
  display:none;
}

.reset-modal {
  background:#ffffff;
  padding:30px;
  border-radius:8px;
  width:90%;
  max-width:400px;
  text-align:center;
}

.reset-modal input {
  width:100%;
  padding:10px;
  margin:15px 0;
}

.reset-modal button {
  margin:5px;
}

/* ──────────────────────────────────────────────── */
/* Added: Rules to make .active toggle actually show the menu */
/* ──────────────────────────────────────────────── */
.nav-menu {
  display: none;
}

.nav-menu.active {
  display: block;
}

/* Optional – improves mobile experience (adjust values to fit your design) */
@media (max-width: 768px) {
  .nav-menu {
    position: absolute;
    top: 50px;              /* move this down if your burger is taller */
    left: 0;
    width: 100%;
    padding: 20px 0;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  }
  
  .nav-menu a {
    display: block;
    padding: 12px;
    font-size: 1.1em;
  }

  .burger {
    position: fixed;
    top: 15px;
    right: 15px;            /* typical burger position – adjust if needed */
    z-index: 1000;
    cursor: pointer;
  }

  .burger div {
    width: 30px;
    height: 4px;
    margin: 6px 0;
    transition: 0.4s;
  }
}
</style>
</head>
<body>

<div class="burger" onclick="toggleMenu()">
  <div></div><div></div><div></div>
</div>

<nav class="nav-menu" id="navMenu">
  <a href="index.html">Home</a>
  <a href="live_auctions.html">Live Auctions</a>
  <a href="private_sales.html">Private Sales</a>
  <a href="contact.html">Contact Us</a>
  <a href="results.html">Results</a>
  <a href="about.html">About Us</a>
  <a href="kollect_100.html">Support</a>
  <a href="create_account.html">Sign In</a>
</nav>

<div id="user-status">Checking login status...</div>
<button id="logout-button" style="display:none;" onclick="logoutUser()">Logout</button>

<div class="container">
  <img src="IMG_1840.jpeg" alt="Kollect Auctions Logo" class="hero-image">

  <div class="card">
    <h2>Sign In</h2>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="button" id="login-button" class="button">Sign In</button>
      <p style="margin-top:10px; text-align:center;">
        <a href="#" id="forgot-password-link">Forgot Password?</a>
      </p>
    </form>
  </div>

  <div class="card">
    <h2>Create Account</h2>
    <form id="signup-form">
      <input type="text" id="signup-firstname" placeholder="First Name" required>
      <input type="text" id="signup-lastname" placeholder="Last Name" required>
      <input type="email" id="signup-email" placeholder="Email" required>
      <input type="password" id="signup-password" placeholder="Password" required>
      <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
      <input type="tel" id="signup-contact" placeholder="Contact Number" required>
      <input type="text" id="signup-address1" placeholder="Address Line 1" required>
      <input type="text" id="signup-address2" placeholder="Address Line 2">
      <input type="text" id="signup-city" placeholder="City" required>
      <input type="text" id="signup-postcode" placeholder="Postcode" required>
      <button type="submit" class="button">Create Account</button>
    </form>
  </div>
</div>

<!-- ✅ RESET PASSWORD MODAL -->
<div class="reset-modal-overlay" id="resetModal">
  <div class="reset-modal">
    <h3>Reset Password</h3>
    <input type="email" id="reset-email" placeholder="Enter your email">
    <div>
      <button id="send-reset" class="button">Send Reset Link</button>
      <button id="close-reset" class="button">Cancel</button>
    </div>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged, signOut, sendEmailVerification, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const ADMIN_UID = "gBrbEobcS5RCG47acE5ySqxO8yB2";
const ADMIN_EMAIL = "peterjames-barrett@outlook.com";

const loginButton = document.getElementById("login-button");
const signupForm = document.getElementById("signup-form");
const userStatus = document.getElementById("user-status");
const logoutButton = document.getElementById("logout-button");

const forgotLink = document.getElementById("forgot-password-link");
const resetModal = document.getElementById("resetModal");
const resetEmailInput = document.getElementById("reset-email");
const sendResetBtn = document.getElementById("send-reset");
const closeResetBtn = document.getElementById("close-reset");

function showPopupMessage(message){
  const popup = document.createElement("div");
  popup.className = "popup-message";
  popup.textContent = message;
  document.body.appendChild(popup);
  setTimeout(()=>popup.classList.add("show"),10);
  setTimeout(()=>popup.remove(),3000);
}

/* ✅ OPEN RESET MODAL + AUTO FILL */
forgotLink.addEventListener("click", e => {
  e.preventDefault();
  const loginEmail = document.getElementById("login-email").value;
  resetEmailInput.value = loginEmail || "";
  resetModal.style.display = "flex";
});

/* ✅ CLOSE MODAL */
closeResetBtn.addEventListener("click", () => {
  resetModal.style.display = "none";
});

/* ✅ SEND RESET EMAIL */
sendResetBtn.addEventListener("click", async () => {
  const email = resetEmailInput.value.trim();
  if(!email) return showPopupMessage("Please enter your email.");

  try{
    await sendPasswordResetEmail(auth, email);
    showPopupMessage("Password reset email sent!");
    resetModal.style.display = "none";
  } catch(err){
    showPopupMessage("Error: " + err.message);
  }
});

/* LOGIN */
loginButton?.addEventListener("click", async () => {
  const email = document.getElementById("login-email").value;
  const password = document.getElementById("login-password").value;
  try {
    const userCredential = await signInWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    const isAdmin = user.uid === ADMIN_UID || user.email === ADMIN_EMAIL;

    if(!user.emailVerified && !isAdmin){
      alert("Please verify your email before logging in.");
      await signOut(auth);
      return;
    }

    showPopupMessage("Login successful!");
    window.location.href = "index.html";
  } catch (err) {
    alert("Login failed: " + err.message);
  }
});

/* SIGNUP (unchanged logic) */
signupForm?.addEventListener("submit", async e => {
  e.preventDefault();
  const firstName = signupForm["signup-firstname"].value.trim();
  const lastName = signupForm["signup-lastname"].value.trim();
  const email = signupForm["signup-email"].value.trim();
  const password = signupForm["signup-password"].value;
  const confirmPassword = signupForm["signup-confirm-password"].value;

  const address1   = signupForm["signup-address1"].value.trim();
  const address2   = signupForm["signup-address2"].value.trim();
  const city       = signupForm["signup-city"].value.trim();
  const postcode   = signupForm["signup-postcode"].value.trim();
  const contact    = signupForm["signup-contact"].value.trim();

  if(password !== confirmPassword) return alert("Passwords do not match!");

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;
    await updateProfile(user, { displayName: firstName + " " + lastName });

    await setDoc(doc(db, "users", user.uid), {
      uid: user.uid,
      firstName,
      lastName,
      email,
      contact,
      address1,
      address2: address2 || "",
      city,
      postcode,
      createdAt: serverTimestamp()
    });

    await sendEmailVerification(user,{url: window.location.origin + '/create_account.html'});
    showPopupMessage("Account created! Check your email.");
    signupForm.reset();
  } catch (err) {
    alert("Signup failed: " + err.message);
  }
});

// ────────────────────────────────────────────────
// Added: Burger menu toggle functionality
// ────────────────────────────────────────────────
function toggleMenu() {
  const menu = document.getElementById("navMenu");
  menu.classList.toggle("active");
}
</script>
</body>
</html>
