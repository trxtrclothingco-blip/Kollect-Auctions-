<script type="module">
import { db, auth } from './firebase.js';
import {
  collection,
  query,
  where,
  orderBy,
  onSnapshot,
  doc,
  serverTimestamp,
  runTransaction,
  getDocs,
  updateDoc,
  getDoc
} from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  const status = document.getElementById('user-status');
  if (user) currentUser = user;
  status.textContent = user ? `Signed in as ${user.email}` : 'You are not signed in';
});

function logoutUser() {
  signOut(auth);
}

// ────────────────────────────────────────────────
// STRIPE SETUP
// ────────────────────────────────────────────────
const stripe = Stripe("pk_test_51T3d6HF7tJn4gBxvucuqimQmfg71cDpalXYwLWSqjWeczJeP6ac7AWkT8CbCTXQVv2fvyegcsEKqoQFrQApkQjrr00udGl6Q3Z#");
const elements = stripe.elements();
const cardPopup = elements.create("card");
cardPopup.mount("#card-element-popup");

// Show Stripe popup
function showCardPopup() {
  document.getElementById("stripe-card-popup").style.display = "flex";
}

// Hide Stripe popup
function hideCardPopup() {
  document.getElementById("stripe-card-popup").style.display = "none";
  cardPopup.clear();
}

// Handle popup form submission
document.getElementById("payment-form-popup").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!currentUser) return alert("You must be signed in to save a card.");

  try {
    const response = await fetch("/create-setup-intent", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ uid: currentUser.uid })
    });
    const { clientSecret } = await response.json();

    const result = await stripe.confirmCardSetup(clientSecret, { payment_method: { card: cardPopup }});
    if (result.error) {
      document.getElementById("card-errors-popup").textContent = result.error.message;
    } else {
      hideCardPopup();
      alert("Card saved! You can now place your bid.");
    }
  } catch (err) {
    console.error(err);
    alert("Failed to save card. See console.");
  }
});

// ────────────────────────────────────────────────
// PLACE BID WITH CARD CHECK
// ────────────────────────────────────────────────
async function placeBid(listingId, bidInput) {
  if (!currentUser) return alert('You must be signed in to place a bid.');
  const bidAmount = Number(bidInput.value);
  if (!bidAmount) return alert('Invalid bid.');

  bidInput.disabled = true;

  try {
    // Check if user has a saved Stripe customer/payment method
    const userDoc = await getDoc(doc(db, "users", currentUser.uid));
    const stripeCustomerId = userDoc.exists() ? userDoc.data().stripeCustomerId : null;

    if (!stripeCustomerId) {
      showCardPopup();
      bidInput.disabled = false;
      return;
    }

    // Place bid in Firestore (existing logic)
    const listingRef = doc(db, 'listings', listingId);
    const bidsRef = collection(db, 'bids');

    await runTransaction(db, async (transaction) => {
      const listingSnap = await transaction.get(listingRef);
      if (!listingSnap.exists()) throw 'Listing not found';

      const listing = listingSnap.data();
      const currentPrice = Number(listing.price || 0);
      if (bidAmount <= currentPrice) throw `Bid must be higher than £${currentPrice}`;

      transaction.update(listingRef, { price: bidAmount });
      transaction.set(doc(bidsRef), {
        listingid: listingId,
        bidamount: bidAmount,
        userid: currentUser.uid,
        useremail: currentUser.email,
        timestamp: serverTimestamp()
      });
    });

    bidInput.value = '';
    const msg = document.getElementById('bid-success-msg');
    msg.style.display = 'flex';
    setTimeout(() => (msg.style.display = 'none'), 2500);

  } catch (err) {
    console.error(err);
    alert(typeof err === 'string' ? err : 'Bid failed. Please try again.');
  } finally {
    bidInput.disabled = false;
  }
}

// ────────────────────────────────────────────────
// (Remaining auction logic unchanged: endAuction, countdown, loadLiveAuctions, all-bids popup etc.)
// ────────────────────────────────────────────────

function endAuction(listingId) { /* existing code */ }
function getCountdownText(endTimestamp) { /* existing code */ }
function openAllBidsPopup(listingId, itemName) { /* existing code */ }
window.openAllBidsPopup = openAllBidsPopup;

function loadLiveAuctions() { /* existing code with bidBtn.onclick = () => placeBid(...) */ }
document.addEventListener('DOMContentLoaded', loadLiveAuctions);

function toggleMenu() { document.getElementById("navMenu").classList.toggle("open"); }

</script>
