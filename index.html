<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title></title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    html,
    body{
      width:100%;
      height:100%;
    }

    body{
      min-height:100vh;
      overflow:hidden;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      position:relative;

      /* BACKGROUND IMAGE */
      background-image:url('./IMG_3374.jpeg');
      background-position:center center;
      background-repeat:no-repeat;
      background-size:cover;
      background-attachment:fixed;
    }

    /* Dark overlay */
    body::before{
      content:'';
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.65);
      backdrop-filter:blur(2px);
      z-index:0;
    }

    .container{
      position:relative;
      z-index:1;
      max-width:800px;
      padding:40px;
    }

    .logo{
      font-size:5rem;
      font-weight:900;
      letter-spacing:4px;
      text-transform:uppercase;
      margin-bottom:20px;

      background:linear-gradient(90deg,#ff2b2b,#00ff99);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      animation:glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow{
      from{
        filter:drop-shadow(0 0 10px rgba(255,0,0,0.3));
      }
      to{
        filter:drop-shadow(0 0 20px rgba(0,255,153,0.4));
      }
    }

    h2{
      font-size:2rem;
      margin-bottom:20px;
      font-weight:600;
    }

    p{
      color:#d1d1d1;
      line-height:1.7;
      margin-bottom:40px;
      font-size:1.1rem;
    }

    .countdown{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin-bottom:40px;
    }

    .time-box{
      width:110px;
      padding:20px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:15px;
      backdrop-filter:blur(8px);
    }

    .time-box h3{
      font-size:2.2rem;
      color:#00ff99;
      margin-bottom:5px;
    }

    .time-box span{
      font-size:0.85rem;
      letter-spacing:2px;
      color:#bbb;
      text-transform:uppercase;
    }

    .button{
      display:inline-block;
      padding:15px 40px;
      border-radius:50px;
      text-decoration:none;
      color:white;
      font-weight:bold;
      letter-spacing:1px;

      background:linear-gradient(90deg,#ff2b2b,#00ff99);

      transition:0.3s ease;
    }

    .button:hover{
      transform:translateY(-3px) scale(1.03);
      opacity:0.95;
    }

    @media(max-width:768px){

      .logo{
        font-size:3rem;
      }

      h2{
        font-size:1.5rem;
      }

      p{
        font-size:1rem;
      }

      .time-box{
        width:85px;
        padding:15px;
      }

      .time-box h3{
        font-size:1.7rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">KOLLECT100</div>

    <h2></h2>

    <p>
      
    </p>

    <div class="countdown">

      <div class="time-box">
        <h3 id="days">00</h3>
        <span>Days</span>
      </div>

      <div class="time-box">
        <h3 id="hours">00</h3>
        <span>Hours</span>
      </div>

      <div class="time-box">
        <h3 id="minutes">00</h3>
        <span>Minutes</span>
      </div>

      <div class="time-box">
        <h3 id="seconds">00</h3>
        <span>Seconds</span>
      </div>

    </div>

    <a href="#" class="button">Launching Soon</a>

  </div>

  <script>

    // SET YOUR LAUNCH DATE HERE
    const launchDate = new Date("may 30, 2026 00:00:00").getTime();

    const countdown = setInterval(() => {

      const now = new Date().getTime();
      const distance = launchDate - now;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      document.getElementById("days").innerHTML = days;
      document.getElementById("hours").innerHTML = hours;
      document.getElementById("minutes").innerHTML = minutes;
      document.getElementById("seconds").innerHTML = seconds;

      if(distance < 0){
        clearInterval(countdown);

        document.querySelector(".countdown").innerHTML = `
          <h2 style="color:#00ff99;">WE ARE LIVE</h2>
        `;
      }

    }, 1000);

  </script>

</body>
</html>
